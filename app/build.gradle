plugins {
    id 'com.android.application'
}

// Optional signing config, loaded from config/signing.properties (scripts/setup.sh).
def signPropsFile = rootProject.file('config/signing.properties')
def loadSignProps = {
    def props = new Properties()
    if (signPropsFile.canRead()) {
        signPropsFile.withInputStream { props.load(it) }
    }
    props
}

android {
    namespace 'com.egraf.motionwake'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.egraf.motionwake"
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName "2.7"
    }

    signingConfigs {
        release {
            def p = loadSignProps()
            if (p['storeFile'] != null) {
                storeFile rootProject.file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Same key as release so install -r between them keeps data/token.
            def p = loadSignProps()
            if (p['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def p = loadSignProps()
            if (p['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/module-info.class']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
