import java.util.Properties

// Optional signing config loaded from config/signing.properties (generated by scripts/setup.sh).
def signProps = new Properties()
def signPropsFile = rootProject.file('config/signing.properties')
if (signPropsFile.canRead()) {
    signPropsFile.withInputStream { signProps.load(it) }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.egraf.motionwake'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.egraf.motionwake"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (signProps['storeFile'] != null) {
                storeFile rootProject.file(signProps['storeFile'])
                storePassword signProps['storePassword']
                keyAlias signProps['keyAlias']
                keyPassword signProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signProps['storeFile'] != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/module-info.class']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
